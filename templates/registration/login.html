{% extends "base.html" %}
{% block title %}Log in · MedTrack{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
  <h1 class="h3 mb-3">Log in</h1>
  {% include "registration/_form_errors.html" %}
  <form method="post">{% csrf_token %}
    {% for field in form %}{% include "registration/_field.html" %}{% endfor %}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary w-100" type="submit">Log in</button>
  </form>
  <p class="mt-3 small">No account? <a href="{% url 'signup' %}">Sign up</a></p>
</div></div>
{% endblock %}
