{% extends "base.html" %}
{% block title %}Log in · MedTrack{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
  <h1 class="h3 mb-3">Log in</h1>
  <form method="post">{% csrf_token %}
    {{ form.non_field_errors }}
    <div class="mb-3"><label class="form-label" for="id_username">Username or email</label>
      <input class="form-control" type="text" name="username" id="id_username" autofocus required></div>
    <div class="mb-3"><label class="form-label" for="id_password">Password</label>
      <input class="form-control" type="password" name="password" id="id_password" required></div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary w-100" type="submit">Log in</button>
  </form>
  <p class="mt-3 small">No account? <a href="{% url 'signup' %}">Sign up</a></p>
</div></div>
{% endblock %}
